[project]
name = "srt-trans"
version = "0.1.0"
description = "다중 LLM 프로바이더 기반 SRT 자막 한국어 번역기 (웹 UI)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.9.0",
    "srt>=3.5.3",
    "json-repair>=0.30.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
]

[project.scripts]
srt-trans = "srt_trans.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srt_trans"]

[tool.uv]
package = true
